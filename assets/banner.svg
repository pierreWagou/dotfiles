<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29" />
      <stop offset="50%" style="stop-color:#302b63" />
      <stop offset="100%" style="stop-color:#24243e" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a825" />
      <stop offset="100%" style="stop-color:#ff6ec7" />
    </linearGradient>
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7eb5e6;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#7eb5e6;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="sunClip">
      <rect x="0" y="0" width="800" height="145" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" />

  <!-- Stars -->
  <circle cx="50" cy="25" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="120" cy="45" r="0.8" fill="#ffffff" opacity="0.4" />
  <circle cx="200" cy="15" r="1.2" fill="#ffffff" opacity="0.7" />
  <circle cx="310" cy="35" r="0.7" fill="#ffffff" opacity="0.3" />
  <circle cx="450" cy="20" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="520" cy="50" r="0.9" fill="#ffffff" opacity="0.4" />
  <circle cx="600" cy="10" r="1.1" fill="#ffffff" opacity="0.6" />
  <circle cx="680" cy="40" r="0.8" fill="#ffffff" opacity="0.5" />
  <circle cx="750" cy="22" r="1" fill="#ffffff" opacity="0.3" />
  <circle cx="90" cy="60" r="0.6" fill="#ffffff" opacity="0.4" />
  <circle cx="370" cy="55" r="0.9" fill="#ffffff" opacity="0.5" />
  <circle cx="650" cy="60" r="0.7" fill="#ffffff" opacity="0.3" />

  <!-- Sun -->
  <circle cx="400" cy="145" r="50" fill="url(#sun)" clip-path="url(#sunClip)" filter="url(#glow)" />

  <!-- Scan lines on sun -->
  <g clip-path="url(#sunClip)">
    <rect x="350" y="108" width="100" height="2" fill="#0f0c29" opacity="0.5" />
    <rect x="350" y="114" width="100" height="2.5" fill="#0f0c29" opacity="0.5" />
    <rect x="350" y="121" width="100" height="3" fill="#0f0c29" opacity="0.5" />
    <rect x="350" y="129" width="100" height="3.5" fill="#0f0c29" opacity="0.5" />
    <rect x="350" y="138" width="100" height="4" fill="#0f0c29" opacity="0.5" />
  </g>

  <!-- Horizon line -->
  <line x1="0" y1="145" x2="800" y2="145" stroke="#ff6ec7" stroke-width="1.5" opacity="0.8" filter="url(#glow)" />

  <!-- Perspective grid - horizontal lines -->
  <line x1="0" y1="155" x2="800" y2="155" stroke="#7eb5e6" stroke-width="0.5" opacity="0.25" />
  <line x1="0" y1="167" x2="800" y2="167" stroke="#7eb5e6" stroke-width="0.5" opacity="0.3" />
  <line x1="0" y1="181" x2="800" y2="181" stroke="#7eb5e6" stroke-width="0.5" opacity="0.35" />
  <line x1="0" y1="197" x2="800" y2="197" stroke="#7eb5e6" stroke-width="0.5" opacity="0.4" />

  <!-- Perspective grid - vertical converging lines -->
  <line x1="400" y1="145" x2="0" y2="200" stroke="#7eb5e6" stroke-width="0.5" opacity="0.3" />
  <line x1="400" y1="145" x2="100" y2="200" stroke="#7eb5e6" stroke-width="0.5" opacity="0.25" />
  <line x1="400" y1="145" x2="200" y2="200" stroke="#7eb5e6" stroke-width="0.5" opacity="0.2" />
  <line x1="400" y1="145" x2="300" y2="200" stroke="#7eb5e6" stroke-width="0.5" opacity="0.15" />
  <line x1="400" y1="145" x2="500" y2="200" stroke="#7eb5e6" stroke-width="0.5" opacity="0.15" />
  <line x1="400" y1="145" x2="600" y2="200" stroke="#7eb5e6" stroke-width="0.5" opacity="0.2" />
  <line x1="400" y1="145" x2="700" y2="200" stroke="#7eb5e6" stroke-width="0.5" opacity="0.25" />
  <line x1="400" y1="145" x2="800" y2="200" stroke="#7eb5e6" stroke-width="0.5" opacity="0.3" />

  <!-- Terminal icon (left) -->
  <g transform="translate(130, 65)" filter="url(#glow)" opacity="0.6">
    <rect x="0" y="0" width="40" height="30" rx="3" fill="none" stroke="#7eb5e6" stroke-width="1.5" />
    <polyline points="8,10 16,15 8,20" fill="none" stroke="#7eb5e6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="20" y1="20" x2="30" y2="20" stroke="#7eb5e6" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Gear icon (right) -->
  <g transform="translate(615, 65)" filter="url(#glow)" opacity="0.6">
    <circle cx="20" cy="15" r="6" fill="none" stroke="#e0b0ff" stroke-width="1.5" />
    <circle cx="20" cy="15" r="12" fill="none" stroke="#e0b0ff" stroke-width="1.5" stroke-dasharray="4 4.5" />
  </g>

  <!-- Title -->
  <text x="400" y="85" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="48" font-weight="700" fill="#ffffff" filter="url(#textGlow)">
    dotfiles
  </text>

  <!-- Subtitle -->
  <text x="400" y="115" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#e0b0ff" letter-spacing="4">
    CHEZMOI + CATPPUCCIN MOCHA + NIX
  </text>
</svg>
