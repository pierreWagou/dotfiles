procs:
  fr-server:
    shell: |
      read -p "Backend port [${FR_API_PORT:-8001}]: " port </dev/tty
      API_HOST=http://localhost:${port:-${FR_API_PORT:-8001}} alan run --scope frontend -- yarn workspace fr-server dev
    autostart: false
  metro:
    shell: "alan run --scope frontend -- yarn workspace alan-mobile dev"
    autostart: false
