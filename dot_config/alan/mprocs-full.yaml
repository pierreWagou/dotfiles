procs:
  fr-server:
    shell: |
      read -p "API port [${FR_API_PORT:-8001}]: " port </dev/tty
      API_PORT=${port:-${FR_API_PORT:-8001}} frontend/bin/start-dev-server fr-server
    autostart: false
  metro:
    shell: "alan run --scope frontend -- yarn workspace alan-mobile dev"
    autostart: false
  fr-api-shared:
    shell: |
      read -p "Frontend port [${FR_SERVER_PORT:-4001}]: " fport </dev/tty
      FRONTEND_PORT=${fport:-${FR_SERVER_PORT:-4001}} backend/bin/start-dev-server fr_api --use-kay=shared_on_aurora
    autostart: false
  fr-api:
    shell: |
      read -p "Frontend port [${FR_SERVER_PORT:-4001}]: " fport </dev/tty
      FRONTEND_PORT=${fport:-${FR_SERVER_PORT:-4001}} backend/bin/start-dev-server fr_api --use-kay=on_aurora
    autostart: false
  mailpit:
    shell: "mise run mailpit"
    autostart: false
  redis:
    shell: |
      direnv exec . bash -c 'redis-server devbox.d/redis/redis.conf --port "${REDIS_PORT:-6379}" --logfile ""'
    autostart: false
  oauth-router:
    shell: "alan run --scope backend -- python -m apps.oauth_router"
    autostart: false
  flask-shell:
    shell: "alan run --scope backend -- env APP=fr_api flask shell --use-kay=on_aurora"
    autostart: false
  events-publisher:
    shell: |
      cd events_pipeline/events_publisher && direnv exec . bash -c 'DATABASE_URL=postgresql:///alan_backend REDIS_STREAMS_URL="${REDIS_STREAMS_URL:-redis://127.0.0.1:6379/0}" uv run python -m events_publisher start --log-level INFO'
    autostart: false
  fr-api-events-consumer:
    shell: |
      cd backend/apps/fr_api && direnv exec . bash -c 'ALAN_LOG_GLOBAL_SESSION_USE=1 ALAN_USE_GLOBAL_SESSION=0 REDIS_STREAMS_URL="${REDIS_STREAMS_URL:-redis://127.0.0.1:6379/0}" flask events_pipeline consumer'
    autostart: false
