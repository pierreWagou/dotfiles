# Layout:
#   ┌──────────┬─────────────┐
#   │          │             │
#   │   nvim   │  opencode   │
#   │ (zoomed) │             │
#   ├──────────┤             │
#   │ terminal │             │
#   └──────────┴─────────────┘
name: <%= @args[0] %>
root: <%= @settings["path"] %>

windows:
  - dev:
      panes:
        - dev:
            - tmux split-window -h -l 40% -d
            - tmux split-window -v -t .1 -l 25% -d
            - tmux send-keys -t .3 'opencode' Enter
            - nvim
