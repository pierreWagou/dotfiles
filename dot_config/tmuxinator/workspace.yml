# Layout:
#   ┌──────────┬─────────────┐
#   │          │             │
#   │   nvim   │    aoe      │
#   │ (zoomed) │  (live)     │
#   ├──────────┤             │
#   │ terminal │             │
#   └──────────┴─────────────┘
name: <%= File.basename(@args[0] || Dir.pwd) %>
root: <%= @settings["path"] %>

<% project_override = File.join(@settings["path"], ".tmuxinator.yml") %>
<% if File.exist?(project_override) %>
<%= ERB.new(File.read(project_override)).result(binding) %>
<% else %>
windows:
  - workspace:
      panes:
        - workspace:
            - tmux split-window -h -l 40% -d
            - tmux split-window -v -t .1 -l 25% -d
            - /run/current-system/sw/bin/tmux send-keys -t .3 'aoe add . -c opencode -t $(basename $(pwd)) 2>/dev/null && aoe session start $(basename $(pwd)) 2>/dev/null; aoe' Enter
            - nvim
<% end %>
<% if File.exist?(File.join(@settings["path"], "mprocs.yaml")) %>
  - services:
      panes:
        - mprocs
<% end %>
