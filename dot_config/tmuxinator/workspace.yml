# Layout:
#   ┌──────────┬─────────────┐
#   │          │             │
#   │   nvim   │  opencode   │
#   │ (zoomed) │             │
#   ├──────────┤             │
#   │ terminal │             │
#   └──────────┴─────────────┘
name: <%= File.basename(@args[0] || Dir.pwd) %>
root: <%= @args[0] %>

windows:
  - workspace:
      panes:
        - workspace:
            - tmux split-window -h -l 40% -d
            - tmux split-window -v -t .1 -l 25% -d
            - tmux send-keys -t .3 'opencode' Enter
            - nvim
<% if File.exist?(File.join(@args[0], "mprocs.yaml")) %>
  - services:
      panes:
        - mprocs
<% end %>
