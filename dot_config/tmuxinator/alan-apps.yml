# Layout:
#   ┌──────────┬─────────────┐
#   │          │             │
#   │   nvim   │    aoe      │
#   │ (zoomed) │  (live)     │
#   ├──────────┤             │
#   │ terminal │             │
#   └──────────┴─────────────┘
name: <%= @args[0] || "alan-apps" %>
root: <%= @settings["path"] || "~/Projects/alan/alan-apps" %>

windows:
  - workspace:
      panes:
        - workspace:
            - mkdir -p ~/.alan/bin && ln -sf /opt/homebrew/bin/tmux ~/.alan/bin/tmux
            - /run/current-system/sw/bin/tmux split-window -h -l 40% -d
            - /run/current-system/sw/bin/tmux split-window -v -t .1 -l 25% -d
            - >-
                /run/current-system/sw/bin/tmux send-keys -t .2 'clear' Enter
            - >-
                /run/current-system/sw/bin/tmux send-keys -t .3 'aoe add
                . -c opencode -t $(basename $(pwd)) 2>/dev/null; aoe
                session start $(basename $(pwd)) 2>/dev/null; sleep 2;
                ID=$(aoe list --json | jq -r --arg p "$(pwd)"
                '"'"'.[]|select(.path==$p)|.id'"'"' | head -1
                | cut -c1-8); SESSION=$(tmux list-sessions 2>/dev/null
                | grep "^aoe_.*${ID}" | cut -d: -f1);
                [ -n "$SESSION" ] &&
                tmux join-pane -s "$SESSION"
                -t .3 -l 100% &&
                tmux kill-pane -t .3' Enter
            - nvim
  - services:
      panes:
        - /bin/sh -c 'until [ -d .devbox/virtenv/nodejs/bin ]; do sleep 1; done; exec zsh -c "mise run mprocs"'
  - aoe:
      panes:
        - /bin/sh -c 'until [ -d .devbox/virtenv/nodejs/bin ]; do sleep 1; done; exec zsh -c "aoe"'
