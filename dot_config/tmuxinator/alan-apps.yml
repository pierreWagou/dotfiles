# Layout:
#   ┌──────────┬─────────────┐
#   │          │             │
#   │   nvim   │  opencode   │
#   │ (zoomed) │             │
#   ├──────────┤             │
#   │ terminal │             │
#   └──────────┴─────────────┘
name: alan-apps
root: ~/Projects/alan/alan-apps

windows:
  - workspace:
      panes:
        - workspace:
            - /run/current-system/sw/bin/tmux split-window -h -l 40% -d
            - /run/current-system/sw/bin/tmux split-window -v -t .1 -l 25% -d
            - /run/current-system/sw/bin/tmux send-keys -t .3 'opencode' Enter
            - nvim
  - services:
      panes:
        - devbox services up
