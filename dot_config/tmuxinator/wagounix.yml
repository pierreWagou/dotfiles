# Layout:
#   ┌──────────┬─────────────┐
#   │          │             │
#   │   nvim   │  opencode   │
#   │ (zoomed) │             │
#   ├──────────┤             │
#   │ terminal │             │
#   └──────────┴─────────────┘
name: <%= @args[0] || "wagounix" %>
root: <%= @settings["path"] || "~/Projects/wagou/wagounix" %>

windows:
  - workspace:
      panes:
        - workspace:
            - tmux split-window -h -l 40% -d
            - tmux split-window -v -t .1 -l 25% -d
            - tmux send-keys -t .3 'omni-wagou' Enter
            - nvim
  - wagou-prime:
      panes:
        - ssh wagou-prime

