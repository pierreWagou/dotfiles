# Television channel for Rex session management
# Rex-native session picker (tmux prefix+f equivalent):
# cycle sources with Ctrl+S, enter opens/switches, Ctrl+D kills.
#
# No sesh dependency: rows are generated by the `sessions_list` Lua action in
# rex/init.lua (live sessions via the Rex API, favorites parsed from
# ~/.config/sesh/sesh.toml as plain data, recents via `zoxide query -l`).
#
# Sources:
#   Active    — live Rex sessions (rex ls); enter switches the app to it
#   Favorites — favorite projects from sesh.toml; enter builds the Rex workspace
#   Zoxide    — zoxide directories; enter builds the Rex workspace
#
# Display: each line is prefixed with a grey nerd-font icon and rendered with
# ANSI colors (ansi = true, like the tmux `sesh` channel). The icon column is
# stripped before parsing: actions/preview use {strip_ansi|split:\t:1/2/3}
# to recover the clean kind/name/path triple.
#
# Enter runs the cockpit_open Lua action: it switches or builds the session
# and closes the picker. Preview runs the cockpit_preview Lua action.

[metadata]
name = "rex-sessions"
description = "Rex sessions — switch, open favorites, or open zoxide dirs"
requirements = ["rex", "jq"]

[source]
command = [
  { name = "Active",    run = "rex do sessions_list source=\"active\" --json 2>/dev/null | jq -r . 2>/dev/null" },
  { name = "Favorites", run = "rex do sessions_list source=\"favorites\" --json 2>/dev/null | jq -r . 2>/dev/null" },
  { name = "Zoxide",    run = "rex do sessions_list source=\"zoxide\" --json 2>/dev/null | jq -r . 2>/dev/null | head -n 100" },
]
ansi = true # preserve icon colors and eza preview colors (like the tmux sesh channel)
display = "{strip_ansi|split:\t:0} {strip_ansi|split:\t:4}" # icon + sesh-like text; parsing still uses :1/2/3
frecency = false # rex / zoxide order is already ranked
no_sort = true # preserve source order
output = "{}"

# Enter and preview delegate to the cockpit_open / cockpit_preview Lua
# actions in rex/init.lua. Kill only targets live Rex sessions.

[preview]
command = "rex do cockpit_preview kind=\"{strip_ansi|split:\\t:1}\" name=\"{strip_ansi|split:\\t:2}\" path=\"{strip_ansi|split:\\t:3}\" --json 2>/dev/null | jq -r . 2>/dev/null"

[ui]
input_header = " Sessions"

[keybindings]
enter = "actions:open"
ctrl-d = ["actions:kill_session", "reload_source"]

[actions.open]
description = "Switch to session or build workspace, then close picker"
command = "rex do cockpit_open kind=\"{strip_ansi|split:\\t:1}\" name=\"{strip_ansi|split:\\t:2}\" path=\"{strip_ansi|split:\\t:3}\" picker_block=\"$REX_BLOCK\""
mode = "execute"

[actions.kill_session]
description = "Kill Rex session (Active source only)"
command = "rex do sessions_kill kind=\"{strip_ansi|split:\\t:1}\" name=\"{strip_ansi|split:\\t:2}\""
mode = "fork"
