# Television channel for worktrunk worktree branches (Rex variant)
# Used via Ctrl+Space g to open a worktree branch in a new Rex session with
# the workspace layout (see worktree_open in rex/init.lua).
#
# Two sources (cycle with <C-s>):
#   1. Existing worktrees (default)
#   2. All local + remote branches (for branches without a worktree yet)
#
# <Enter> works from both: wt ensures the worktree exists, then the
# worktree_open Lua action builds the Rex session.

[metadata]
name = "rex-worktrees"
description = "Open a worktree branch in a new Rex session"
requirements = ["wt", "git", "rex", "jq"]

[source]
command = [
  # Default: existing worktrees — fast via git porcelain (skips detached HEADs)
  "git worktree list --porcelain | awk '/^worktree/{wt=$2} /^branch/{print substr($2,12) \"\\t-\\t\" wt}'",
  # Alt: all local + remote branches (for creating new worktrees)
  "git branch --all --format='%(refname:short)' | sed 's|^origin/||' | sort -u",
]
ansi = true # preserve git log preview colors (the tmux channel lacks this)

[preview]
command = "git log --oneline --graph --color=always -20 '{split:\\t:0}' 2>/dev/null || git log --oneline --graph --color=always -20 '{}'"

[ui]
input_header = " Worktree Branches"

[keybindings]
enter = "actions:open"
ctrl-g = "actions:create"
ctrl-d = "actions:remove"

[actions.open]
description = "Ensure worktree exists, then build the Rex workspace session"
command = "wt switch --no-hooks '{split:\\t:0}' --format json 2>/dev/null | jq -r .path | xargs -I% rex do worktree_open path=\"%\""
mode = "execute"
interactive = true

[actions.create]
description = "Create new branch + worktree and build the Rex workspace session"
command = "wt switch --create --no-hooks '{split:\\t:0}' --format json 2>/dev/null | jq -r .path | xargs -I% rex do worktree_open path=\"%\""
mode = "execute"
interactive = true

[actions.remove]
description = "Remove worktree"
command = "wt remove '{split:\\t:0}'"
mode = "execute"
interactive = true
