# Worktrunk global configuration
# Manages git worktrees with tmux session integration
#
# Workflow:
# prefix+g opens worktree branch picker (television)
# worktrunk creates/switches worktree
# hooks create tmux session via tmuxinator with workspace layout

# Worktree path: subdirectory of the project root (bare repo layout)
# .git/ is the bare repo, worktrees are siblings: project/main/, project/feature/, etc.
worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

# --- Hooks ---

# Create or attach to tmux session on every switch (new and existing worktrees)
[post-switch]
tmuxinator = "tmuxinator start {{ repo }} {{ repo }}-{{ branch | sanitize }} path={{ worktree_path }}"

# Auto-cleanup: kill tmux session when worktree is removed or merged
[pre-remove]
tmux = "tmux kill-session -t {{ repo }}-{{ branch | sanitize }} 2>/dev/null || true"

# Per-project overrides
[projects."github.com/alan-eu/alan-apps"]
# Interim fix: ensure ~/.alan/bin/nix points to upstream Nix (not Lix) before devbox initializes.
# Lix lacks fetchClosure which devbox requires. Remove once fix/lix-nix-upstream (PR #107282) merges.
pre-start.fix-nix = "ln -sf ~/.nix-profiles/upstream-nix/bin/nix ~/.alan/bin/nix"

# Warm devbox before tmuxinator spawns panes — prevents concurrent direnv races.
# Runs direnv once to completion in the terminal, then tmuxinator opens with warm virtenv.
[projects."github.com/alan-eu/alan-apps".post-switch]
tmuxinator = "direnv exec '{{ worktree_path }}' true && /run/current-system/sw/bin/tmuxinator start {{ repo }} {{ repo }}-{{ branch | sanitize }} path={{ worktree_path }}"
