[default_session]
startup_command = "tmuxinator start workspace $(basename {}) path={} --append && tmux kill-window -t $(basename {}):1"
preview_command = "eza --all --git --icons --color=always {}"

[[session]]
name = "alan-apps"
path = "~/Projects/alan/alan-apps"

[[session]]
name = "dotfiles"
path = "~/.local/share/chezmoi"
startup_command = "tmuxinator start workspace {} path={} --append && tmux kill-window -t $(basename {}):1"

[[session]]
name = "wagounix"
path = "~/Projects/wagou/wagounix"

[[session]]
name = "atelier-limoun"
path = "~/Projects/wagou/atelier-limoun"
startup_command = "tmuxinator start atelier-limoun"

[[session]]
name = "alan"
path = "~/Projects/alan"
startup_command = "tmuxinator start alan"
